<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quotex Signal Engine - Fractal Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(circle at top,#1a0a0a,#050202);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Roboto Mono',monospace;
  color:#fff;
}
.panel{
  width:460px;
  padding:26px;
  border-radius:24px;
  background:linear-gradient(180deg,#2a0f0f,#100303);
  box-shadow:0 0 50px rgba(255,0,0,.45);
  border:2px solid rgba(255,0,0,.25);
}
h1{
  text-align:center;
  font-family:'Orbitron',sans-serif;
  font-size:26px;
  letter-spacing:2px;
  color:#ff3b3b;
  text-shadow:0 0 12px #ff0000;
}
.clock{
  text-align:center;
  font-family:'Orbitron',sans-serif;
  font-size:16px;
  margin:10px 0 16px;
  color:#ff7f7f;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.form-group{
  display:flex;
  flex-direction:column;
}
.form-group.full{
  grid-column:1 / -1;
}
label{
  font-size:11px;
  opacity:.85;
  margin-bottom:4px;
}
select,input{
  padding:13px;
  background:#2b0c0c;
  border:1px solid #ff3b3b55;
  border-radius:14px;
  color:#ffd9d9;
}
button{
  width:48%;
  padding:15px;
  border:none;
  border-radius:20px;
  background:linear-gradient(90deg,#ff3b3b,#ff0000);
  font-family:'Orbitron',sans-serif;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,0,0,.75);
}
.signal{
  margin-top:22px;
  padding:16px;
  border-radius:18px;
  background:#1b0a0a;
  border:2px solid rgba(255,0,0,.35);
  display:none;
  white-space:pre-line;
  font-size:14px;
}
.footer{
  text-align:center;
  margin-top:16px;
  font-size:11px;
  opacity:.6;
}
.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(4px);
  align-items:center;
  justify-content:center;
}
.modal{
  background:#2a0a0a;
  padding:22px;
  border-radius:16px;
  width:300px;
  border:2px solid #ff3b3b;
  text-align:center;
}
.modal input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  background:#1c0b0b;
  border:1px solid #ff3b3b55;
  color:#ffd9d9;
}
.modal .error{
  color:#ff6666;
  font-size:13px;
}
.copy-btn{
  margin-top:10px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:18px;
  background:#00ff9c;
  color:#000;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="panel">
<h1>FRACTAL LOGIC</h1>
<div class="clock" id="clock">--:--:--</div>

<div class="form-grid">
  <div class="form-group">
    <label>Platform</label>
    <select id="broker">
      <option>Quotex</option>
      <option>Pocket Option</option>
      <option>Binomo</option>
    </select>
  </div>
  <div class="form-group">
    <label>Market Mode</label>
    <select id="marketMode" onchange="updatePairs()">
      <option value="REAL">REAL Market</option>
      <option value="OTC">OTC Market</option>
    </select>
  </div>
  <div class="form-group full">
    <label>Asset Pair</label>
    <select id="pair"></select>
  </div>
  <div class="form-group">
    <label>Timeframe</label>
    <select id="timeFrame">
      <option>1 Minute</option>
      <option>2 Minute</option>
      <option>5 Minute</option>
    </select>
  </div>
  <div class="form-group">
    <label>Time Zone</label>
    <select>
      <option>BDT (UTC +6)</option>
    </select>
  </div>
  <div class="form-group full">
    <label>Number of Signals</label>
    <input type="number" id="signalCount" min="1" max="20" placeholder="1 - 20">
  </div>
</div>

<div style="display:flex;justify-content:space-between;margin-top:18px;">
  <button onclick="openModal()">GENERATE</button>
  <button onclick="resetSignal()">RESET</button>
</div>

<div class="signal" id="signalBox"></div>
<button class="copy-btn" id="copyBtn" onclick="copySignal()" style="display:none;">Copy All</button>

<div class="footer">© Powered by Quotex Signal Engine</div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 style="color:#ff3b3b;">🔒 Verification</h3>
    <input type="password" id="codeInput" placeholder="Enter code">
    <div style="display:flex;justify-content:space-between;">
      <button onclick="submitCode()">Submit</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
    <div class="error" id="modalError"></div>
  </div>
</div>

<script>
const verifyCode="105";

const realPairs=["EUR/USD","GBP/USD","USD/JPY","USD/CHF","AUD/USD","USD/CAD","EUR/JPY","GBP/JPY","EUR/GBP"];
const otcPairs=["USD/INR (OTC)","USD/BDT (OTC)","USD/PKR (OTC)","USD/BRL (OTC)","NZD/USD (OTC)","AUD/NZD (OTC)"];

function updatePairs(){
  const mode=document.getElementById("marketMode").value;
  const sel=document.getElementById("pair");
  sel.innerHTML="";
  (mode==="REAL"?realPairs:otcPairs).forEach(p=>{
    const o=document.createElement("option");
    o.textContent=p;
    sel.appendChild(o);
  });
}
updatePairs();

// Clock
function updateClock(){
  const n=new Date();
  clock.innerText=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
}
setInterval(updateClock,1000);updateClock();

// Modal
function openModal(){modalBg.style.display="flex";modalError.innerText="";codeInput.value="";}
function closeModal(){modalBg.style.display="none";}
function submitCode(){
  if(codeInput.value!==verifyCode){
    modalError.innerText="❌ Invalid Code";
    return;
  }
  closeModal();
  generateSignal();
}

// Signal Generator
function generateSignal(){
  const count=parseInt(signalCount.value);
  if(!count||count<1||count>20){alert("Enter 1-20");return;}

  const broker=brokerSelect.value=broker.value;
  const tf=timeFrame.value;
  const pair=pairSelect?.value || pair.value;

  const now=new Date();
  const dateStr=`🎇 ${String(now.getDate()).padStart(2,'0')}.${String(now.getMonth()+1).padStart(2,'0')}.${now.getFullYear()} | UTC +6 (Dhaka)`;

  let header=
`📊 Platform: ${broker}
⏱ Timeframe: ${tf}

📌 Rule: 1-Step Martingale (Safety Try)

📍 Signals – ${pair}:
`;

  let actions=[];
  for(let i=0;i<count;i++){actions.push(i%2===0?"BUY":"PUT");}
  actions.sort(()=>Math.random()-0.5);

  let body="";
  let t=new Date(now.getTime());

  for(let i=0;i<count;i++){
    const gap=Math.floor(Math.random()*5)+4; // 4–8 min
    t.setMinutes(t.getMinutes()+gap);
    body+=`〆 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} – ${actions[i]}\n`;
  }

  body+=`\n🚫 Avoid: Doji Candle • Gap Market • Low Payout`;

  signalBox.style.display="block";
  signalBox.innerText=`${dateStr}\n${header}${body}`;
  copyBtn.style.display="block";
}

function resetSignal(){
  signalBox.style.display="none";
  signalBox.innerText="";
  copyBtn.style.display="none";
}
function copySignal(){
  navigator.clipboard.writeText(signalBox.innerText);
  alert("Signal copied!");
}
</script>
</body>
</html>
