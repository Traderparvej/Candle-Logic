<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE PRO SIGNALS</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ["Orbitron", "sans-serif"],
                        mono:["Roboto Mono", "monospace"],
                    },
                    colors: {
                        'brand-red': '#ff3b3b',
                        'brand-dark': '#1a0a0a',
                        'brand-black': '#050202',
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    
    <!-- Framer Motion -->
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js" crossorigin></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest" crossorigin></script>

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top, #1a0a0a, #050202);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 59, 59, 0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 59, 59, 0.4);
        }

        /* Disable right click */
        body {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Error handling for the script
        window.onerror = function(message, source, lineno, colno, error) {
            console.error("Global Error:", message, "at", source, ":", lineno);
            return false;
        };

        const { useState, useEffect, useMemo } = React;
        
        // Safely access FramerMotion
        const motion = window.Motion ? window.Motion.motion : (window.FramerMotion ? window.FramerMotion.motion : null);
        const AnimatePresence = window.Motion ? window.Motion.AnimatePresence : (window.FramerMotion ? window.FramerMotion.AnimatePresence : null);

        if (!motion || !AnimatePresence) {
            console.error("Framer Motion not loaded correctly. Check CDN.");
        }

        // Lucide Icon Component Wrapper
        const Icon = ({ name, size = 24, className = "", ...props }) => {
            const icons = {
                Lock: <path d="M19 11H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2ZM7 11V7a5 5 0 0 1 10 0v4" />,
                RefreshCw: <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8m0 0V2m0 6h-6M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16m0 0v6m0-6h6" />,
                Copy: <path d="M8 17.929H6c-1.105 0-2-.912-2-2.036V5.036C4 3.912 4.895 3 6 3h8c1.105 0 2 .912 2 2.036v.929M11 8.071h7c1.105 0 2 .912 2 2.036v10.857c0 1.124-.895 2.036-2 2.036h-7c-1.105 0-2-.912-2-2.036V10.107c0-1.124.895-2.036 2-2.036Z" />,
                Check: <path d="M20 6 9 17l-5-5" />,
                AlertCircle: <><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></>,
                Clock: <><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>,
                TrendingUp: <><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></>,
                TrendingDown: <><polyline points="23 18 13.5 8.5 8.5 13.5 1 6" /><polyline points="17 18 23 18 23 12" /></>,
                ShieldCheck: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" /><path d="m9 12 2 2 4-4" /></>,
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
                Globe: <><circle cx="12" cy="12" r="10" /><line x1="2" x2="22" y1="12" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></>,
                Cpu: <><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><line x1="9" x2="9" y1="2" y2="4" /><line x1="15" x2="15" y1="2" y2="4" /><line x1="9" x2="9" y1="20" y2="22" /><line x1="15" x2="15" y1="20" y2="22" /><line x1="20" x2="22" y1="9" y2="9" /><line x1="20" x2="22" y1="15" y2="15" /><line x1="2" x2="4" y1="9" y2="9" /><line x1="2" x2="4" y1="15" y2="15" /></>,
                BarChart3: <><path d="M3 3v18h18" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" /></>,
                ChevronRight: <path d="m9 18 6-6-6-6" />,
                Info: <><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="16" y2="12" /><line x1="12" x2="12.01" y1="8" y2="8" /></>
            };

            return (
                <svg 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                    {...props}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        const REAL_PAIRS =[
            'EUR/USD', 'GBP/USD', 'USD/JPY', 'AUD/USD', 'USD/CAD', 
            'EUR/GBP', 'EUR/JPY', 'GBP/JPY', 'USD/CHF'
        ];

        const OTC_PAIRS =[
            "USD/ARS(OTC)", "USD/BDT(OTC)", "USD/EGP(OTC)", "USD/INR(OTC)", "USD/IDR(OTC)", "USD/MXN(OTC)",
            "EUR/AUD(OTC)", "EUR/CHF(OTC)", "EUR/SGD(OTC)", "GBP/CHF(OTC)", "NZD/CAD(OTC)", "AUD/NZD(OTC)",
            "CAD/CHF(OTC)", "EUR/NZD(OTC)", "USD/PHP(OTC)", "GBP/NZD(OTC)", "USD/BRL(OTC)", "USD/ZAR(OTC)",
            "EUR/CAD(OTC)", "AUD/CHF(OTC)", "CHF/JPY(OTC)", "NZD/CHF(OTC)", "USD/COP(OTC)", "USD/DZD(OTC)",
            "USD/NGN(OTC)", "USD/TRY(OTC)", "USD/PKR(OTC)", "NZD/JPY(OTC)", "NZD/USD(OTC)"
        ];

        const toMonospace = (str) => {
            const map = {
                '0': '𝟶', '1': '𝟷', '2': '𝟸', '3': '𝟹', '4': '𝟺', '5': '𝟻', '6': '𝟼', '7': '𝟽', '8': '𝟾', '9': '𝟿',
                'A': '𝙰', 'B': '𝙱', 'C': '𝙲', 'D': '𝙳', 'E': '𝙴', 'F': '𝙵', 'G': '𝙶', 'H': '𝙷', 'I': '𝙸', 'J': '𝙹',
                'K': '𝙺', 'L': '𝙻', 'M': '𝙼', 'N': '𝙽', 'O': '𝙾', 'P': '𝙿', 'Q': '𝚀', 'R': '𝚁', 'S': '𝚂', 'T': '𝚃',
                'U': '𝚄', 'V': '𝚅', 'W': '𝚆', 'X': '𝚇', 'Y': '𝚈', 'Z': '𝚉',
                'a': '𝚊', 'b': '𝚋', 'c': '𝚌', 'd': '𝚍', 'e': '𝚎', 'f': '𝚏', 'g': '𝚐', 'h': '𝚑', 'i': '𝚒', 'j': '𝚓',
                'k': '𝚔', 'l': '𝚕', 'm': '𝚖', 'n': '𝚗', 'o': '𝚘', 'p': '𝚙', 'q': '𝚀', 'r': '𝚛', 's': '𝚜', 't': '𝚝',
                'u': '𝚞', 'v': '𝚟', 'w': '𝚠', 'x': '𝚡', 'y': '𝚢', 'z': '𝚣',
                ':': ':', '-': '-'
            };
            return str.split('').map(c => map[c] || c).join('');
        };

        // 🔑 === এখানে আপনার পাসওয়ার্ড সেট করুন === 🔑
        const SECRET_PASSWORD = "itBD4067"; 

        function App() {
            // LocalStorage রিমুভ করে দিয়েছি। এখন পেজ রিলোড দিলে বা ওপেন করলে সবসময় আগে পাসওয়ার্ড চাইবে।
            const[isLoggedIn, setIsLoggedIn] = useState(false);
            
            const[loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [currentTime, setCurrentTime] = useState(new Date());
            const[broker, setBroker] = useState('Quotex');
            const[selectedPairs, setSelectedPairs] = useState(['USD/BDT(OTC)']);
            const[timeFrame, setTimeFrame] = useState('1');
            const[signalMode, setSignalMode] = useState('BOTH');
            const [signalCount, setSignalCount] = useState('10');
            const[startTime, setStartTime] = useState('09:00');
            const [endTime, setEndTime] = useState('17:00');
            
            const[generatedSignals, setGeneratedSignals] = useState('');
            const[isCopied, setIsCopied] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);

            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentTime(new Date());
                }, 1000);
                return () => clearInterval(timer);
            },[]);

            const formatTime = (date) => {
                return date.toLocaleTimeString('en-GB', { hour12: false });
            };

            const togglePair = (pair) => {
                setSelectedPairs(prev => 
                    prev.includes(pair) 
                        ? prev.filter(p => p !== pair) 
                        : [...prev, pair]
                );
            };

            const handleOpenModal = () => {
                if (selectedPairs.length === 0) {
                    alert("Please select at least one asset pair.");
                    return;
                }
                generateSignals();
            };

            const handleReset = () => {
                setGeneratedSignals('');
                setIsCopied(false);
                setSelectedPairs(['USD/BDT(OTC)']);
            };

            const generateSignals = async () => {
                setIsGenerating(true);
                const totalSignals = parseInt(signalCount);
                
                if (!totalSignals || totalSignals < 1) {
                    alert("Enter valid signal count");
                    setIsGenerating(false);
                    return;
                }

                const[startH, startM] = startTime.split(":").map(Number);
                const [endH, endM] = endTime.split(":").map(Number);
                
                const startDate = new Date();
                startDate.setHours(startH, startM, 0, 0);
                
                const endDate = new Date();
                endDate.setHours(endH, endM, 0, 0);

                if (endDate <= startDate) {
                    alert("End Time must be after Start Time");
                    setIsGenerating(false);
                    return;
                }

                const now = new Date();
                const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
                
                let output = `🚀 ${toMonospace('LIVE PRO SIGNALS')}\n`;
                output += `📅 ${toMonospace(dateStr)} | 🏦 ${toMonospace(broker.toUpperCase())}\n`;
                output += `⏱️ ${toMonospace('TIMEFRAME')}: ${toMonospace(timeFrame + ' MIN')}\n\n`;

                let actions =[];
                if (signalMode === "CALL") actions = Array(totalSignals).fill("CALL");
                else if (signalMode === "PUT") actions = Array(totalSignals).fill("PUT");
                else {
                    let remaining = totalSignals;
                    let lastAction = Math.random() < 0.5 ? "CALL" : "PUT";
                    while (remaining > 0) {
                        let clusterSize = Math.min(remaining, 2);
                        for (let i = 0; i < clusterSize; i++) actions.push(lastAction);
                        remaining -= clusterSize;
                        lastAction = lastAction === "CALL" ? "PUT" : "CALL";
                    }
                }

                const totalMinutes = (endDate.getTime() - startDate.getTime()) / 60000;
                const numClusters = Math.ceil(actions.length / 2);
                const gapBetweenClusters = Math.max(1, Math.floor((totalMinutes - numClusters) / numClusters));

                let t = new Date(startDate);

                for (let i = 0; i < actions.length; i++) {
                    const clusterIndex = Math.floor(i / 2);
                    const pairName = selectedPairs[clusterIndex % selectedPairs.length];
                    const action = actions[i];
                    const actionText = action === "CALL" ? "BUY" : "PUT";
                    
                    if (i % 2 === 1) t.setMinutes(t.getMinutes() + 1);
                    else t.setMinutes(t.getMinutes() + gapBetweenClusters);

                    if (t > endDate) break;

                    const formattedPair = pairName.replace('/', '').replace('(OTC)', '-OTC').toUpperCase();
                    const timeStr = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
                    
                    const line = `${timeStr}:${formattedPair}:${actionText}`;
                    output += `${toMonospace(line)}\n`;
                }

                output += `\n⚠️ ${toMonospace('Rules: 1-Step MTG | Avoid Doji')}`;
                
                setGeneratedSignals(output);
                setIsGenerating(false);
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(generatedSignals);
                setIsCopied(true);
                setTimeout(() => setIsCopied(false), 2000);
            };

            // Login Verification Function
            const handleLogin = () => {
                if (loginPass.trim() === SECRET_PASSWORD) {
                    setIsLoggedIn(true);
                    // Local Storage এ আর ডেটা সেভ হবে না, তাই রিলোড দিলেই আবার লগআউট হয়ে যাবে।
                } else {
                    setLoginError('❌ INVALID ACCESS KEY');
                    setLoginPass('');
                }
            };

            if (!isLoggedIn) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-[#050202] p-4 font-mono">
                        <motion.div 
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            className="w-full max-w-[400px] p-10 rounded-[40px] bg-[#0a0505] border border-brand-red/20 shadow-[0_0_100px_rgba(255,0,0,0.15)] text-center"
                        >
                            <div className="w-20 h-20 bg-brand-red/10 rounded-full flex items-center justify-center mx-auto mb-8 border border-brand-red/20">
                                <Icon name="Lock" className="text-brand-red" size={36} />
                            </div>
                            <h2 className="text-white font-orbitron font-black text-2xl mb-2 tracking-tight">PROTECTED ACCESS</h2>
                            <p className="text-white/40 text-[10px] mb-8 uppercase tracking-[0.3em]">Enter your secure credentials</p>
                            
                            <div className="space-y-4">
                                <input 
                                    type="password" 
                                    value={loginPass}
                                    onChange={(e) => setLoginPass(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && handleLogin()}
                                    placeholder="ENTER PASSWORD"
                                    className="w-full p-5 rounded-2xl bg-white/5 border border-brand-red/20 text-white outline-none focus:border-brand-red text-center text-xl tracking-[0.2em] font-bold placeholder:text-white/10"
                                    autoFocus
                                />
                                
                                <button 
                                    onClick={handleLogin}
                                    className="w-full p-5 rounded-2xl bg-brand-red text-white font-orbitron font-black text-sm shadow-[0_10px_30px_rgba(255,0,0,0.3)] hover:bg-red-600 transition-all active:scale-95"
                                >
                                    UNLOCK SYSTEM
                                </button>
                            </div>

                            <AnimatePresence>
                                {loginError && (
                                    <motion.div 
                                        initial={{ opacity: 0, y: 10 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        className="mt-6 text-red-500 text-[10px] font-bold flex items-center justify-center gap-2 uppercase tracking-widest"
                                    >
                                        <Icon name="AlertCircle" size={14} />
                                        {loginError}
                                    </motion.div>
                                )}
                            </AnimatePresence>
                            
                            <div className="mt-10 pt-8 border-t border-white/5">
                                <p className="text-[8px] text-white/20 uppercase tracking-[0.4em]">Encrypted Connection Active</p>
                            </div>
                        </motion.div>
                    </div>
                );
            }

            return (
                <div className="flex items-center justify-center min-h-screen p-4 font-mono">
                    <motion.div 
                        initial={{ opacity: 0, scale: 0.95 }}
                        animate={{ opacity: 1, scale: 1 }}
                        className="w-full max-w-[520px] p-8 rounded-[32px] bg-gradient-to-b from-[#1a0a0a] to-[#050202] shadow-[0_0_80px_rgba(255,0,0,0.3)] border border-brand-red/20 relative overflow-hidden"
                    >
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-brand-red to-transparent opacity-50" />
                        
                        <div className="flex items-center justify-between mb-8">
                            <div>
                                <h1 className="font-orbitron text-2xl font-black text-brand-red drop-shadow-[0_0_15px_rgba(255,0,0,0.6)] flex items-center gap-2">
                                    <Icon name="Zap" className="fill-brand-red" size={24} />
                                    LIVE PRO
                                </h1>
                                <p className="text-[10px] text-brand-red/60 font-orbitron tracking-[0.2em] uppercase">Smart Signal Engine v2.0</p>
                            </div>
                            <div className="text-right">
                                <div className="font-orbitron text-lg font-bold text-[#ff7f7f] flex items-center justify-end gap-2">
                                    <Icon name="Clock" size={18} className="animate-pulse" />
                                    {formatTime(currentTime)}
                                </div>
                                <p className="text-[10px] text-brand-red/40 uppercase">System Status: Optimal</p>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1">
                                    <label className="text-[10px] text-brand-red/60 uppercase font-bold flex items-center gap-1">
                                        <Icon name="Globe" size={12} /> Broker
                                    </label>
                                    <select 
                                        value={broker}
                                        onChange={(e) => setBroker(e.target.value)}
                                        className="w-full p-3 bg-white/5 border border-brand-red/20 rounded-2xl text-[#ffd9d9] outline-none focus:border-brand-red/60 transition-all appearance-none cursor-pointer"
                                    >
                                        <option className="bg-[#1a0a0a]">Quotex</option>
                                        <option className="bg-[#1a0a0a]">Pocket Option</option>
                                        <option className="bg-[#1a0a0a]">Binomo</option>
                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] text-brand-red/60 uppercase font-bold flex items-center gap-1">
                                        <Icon name="BarChart3" size={12} /> Timeframe
                                    </label>
                                    <select 
                                        value={timeFrame}
                                        onChange={(e) => setTimeFrame(e.target.value)}
                                        className="w-full p-3 bg-white/5 border border-brand-red/20 rounded-2xl text-[#ffd9d9] outline-none focus:border-brand-red/60 transition-all appearance-none cursor-pointer"
                                    >
                                        <option value="1" className="bg-[#1a0a0a]">1 Minute</option>
                                        <option value="2" className="bg-[#1a0a0a]">2 Minute</option>
                                        <option value="5" className="bg-[#1a0a0a]">5 Minute</option>
                                    </select>
                                </div>
                            </div>

                            <div className="space-y-2">
                                <label className="text-[10px] text-brand-red/60 uppercase font-bold flex items-center gap-1">
                                    <Icon name="Cpu" size={12} /> Asset Selection
                                </label>
                                <div className="p-4 bg-white/5 border border-brand-red/10 rounded-2xl space-y-4">
                                    <div>
                                        <p className="text-[9px] text-white/40 mb-2 uppercase tracking-wider">Real Market</p>
                                        <div className="flex flex-wrap gap-2">
                                            {REAL_PAIRS.map(pair => (
                                                <button
                                                    key={pair}
                                                    onClick={() => togglePair(pair)}
                                                    className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all border ${
                                                        selectedPairs.includes(pair) 
                                                            ? 'bg-brand-red/20 border-brand-red text-brand-red shadow-[0_0_10px_rgba(255,0,0,0.2)]' 
                                                            : 'bg-white/5 border-white/10 text-white/40 hover:border-white/20'
                                                    }`}
                                                >
                                                    {pair}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="h-px bg-white/5" />
                                    <div>
                                        <p className="text-[9px] text-white/40 mb-2 uppercase tracking-wider">OTC Market</p>
                                        <div className="flex flex-wrap gap-2">
                                            {OTC_PAIRS.map(pair => (
                                                <button
                                                    key={pair}
                                                    onClick={() => togglePair(pair)}
                                                    className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all border ${
                                                        selectedPairs.includes(pair) 
                                                            ? 'bg-brand-red/20 border-brand-red text-brand-red shadow-[0_0_10px_rgba(255,0,0,0.2)]' 
                                                            : 'bg-white/5 border-white/10 text-white/40 hover:border-white/20'
                                                    }`}
                                                >
                                                    {pair}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1 col-span-2">
                                    <label className="text-[10px] text-brand-red/60 uppercase font-bold flex items-center gap-1">
                                        <Icon name="ShieldCheck" size={12} /> Signal Mode
                                    </label>
                                    <div className="flex p-1 bg-white/5 rounded-2xl border border-brand-red/10">
                                        {['BOTH', 'CALL', 'PUT'].map(mode => (
                                            <button
                                                key={mode}
                                                onClick={() => setSignalMode(mode)}
                                                className={`flex-1 py-2 rounded-xl text-[10px] font-bold transition-all ${
                                                    signalMode === mode 
                                                        ? 'bg-brand-red text-white shadow-lg' 
                                                        : 'text-white/40 hover:text-white/60'
                                                }`}
                                            >
                                                {mode === 'BOTH' ? 'CALL & PUT' : mode}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-1">
                                    <label className="text-[10px] text-brand-red/60 uppercase font-bold">Count</label>
                                    <input 
                                        type="number" 
                                        value={signalCount}
                                        onChange={(e) => setSignalCount(e.target.value)}
                                        className="w-full p-3 bg-white/5 border border-brand-red/20 rounded-2xl text-[#ffd9d9] outline-none focus:border-brand-red/60"
                                    />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] text-brand-red/60 uppercase font-bold">Time Window</label>
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="time" 
                                            value={startTime}
                                            onChange={(e) => setStartTime(e.target.value)}
                                            className="flex-1 p-2 bg-white/5 border border-brand-red/20 rounded-xl text-[10px] text-[#ffd9d9] outline-none"
                                        />
                                        <Icon name="ChevronRight" size={12} className="text-white/20" />
                                        <input 
                                            type="time" 
                                            value={endTime}
                                            onChange={(e) => setEndTime(e.target.value)}
                                            className="flex-1 p-2 bg-white/5 border border-brand-red/20 rounded-xl text-[10px] text-[#ffd9d9] outline-none"
                                        />
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-4 pt-2">
                                <button 
                                    onClick={handleOpenModal}
                                    disabled={isGenerating}
                                    className="flex-[2] p-4 rounded-2xl bg-gradient-to-r from-brand-red to-red-600 font-orbitron text-sm font-black text-white shadow-[0_10px_30px_rgba(255,0,0,0.4)] hover:shadow-[0_15px_40px_rgba(255,0,0,0.5)] hover:-translate-y-0.5 active:translate-y-0 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                >
                                    {isGenerating ? <Icon name="RefreshCw" className="animate-spin" size={18} /> : <Icon name="Zap" size={18} />}
                                    GENERATE SIGNALS
                                </button>
                                <button 
                                    onClick={handleReset}
                                    className="flex-1 p-4 rounded-2xl bg-white/5 border border-white/10 font-orbitron text-xs font-bold text-white/60 hover:bg-white/10 hover:text-white transition-all flex items-center justify-center gap-2"
                                >
                                    <Icon name="RefreshCw" size={14} />
                                    RESET
                                </button>
                            </div>
                        </div>

                        <AnimatePresence>
                            {generatedSignals && (
                                <motion.div
                                    initial={{ opacity: 0, y: 20 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: 20 }}
                                    className="mt-8 space-y-4"
                                >
                                    <div className="relative group">
                                        <div className="absolute -inset-1 bg-gradient-to-r from-brand-red/20 to-transparent rounded-3xl blur-md opacity-50 group-hover:opacity-100 transition-opacity" />
                                        <div className="relative p-6 rounded-2xl bg-black/40 border border-brand-red/20 backdrop-blur-xl font-mono text-[11px] leading-relaxed text-[#ffd9d9] max-h-[400px] overflow-y-auto custom-scrollbar">
                                            <div className="whitespace-pre-wrap">{generatedSignals}</div>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={copyToClipboard}
                                        className={`w-full p-4 rounded-2xl font-orbitron font-black text-xs transition-all flex items-center justify-center gap-2 shadow-lg ${
                                            isCopied 
                                                ? 'bg-emerald-500 text-white shadow-emerald-500/20' 
                                                : 'bg-[#00ff9c] text-black shadow-[#00ff9c]/20 hover:scale-[1.01]'
                                        }`}
                                    >
                                        {isCopied ? <Icon name="Check" size={16} /> : <Icon name="Copy" size={16} />}
                                        {isCopied ? 'COPIED TO CLIPBOARD' : 'COPY ALL SIGNALS'}
                                    </button>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        <div className="mt-8 flex items-center justify-center gap-4 text-[9px] text-white/20 uppercase tracking-widest">
                            <span className="flex items-center gap-1"><Icon name="Info" size={10} /> Algorithmic Analysis</span>
                            <span className="w-1 h-1 rounded-full bg-white/10" />
                            <span>Secure Connection</span>
                        </div>
                    </motion.div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
