<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quotex Signal Engine - Fractal Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(circle at top,#1a0a0a,#050202);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Roboto Mono',monospace;
  color:#fff;
}
.panel{
  width:450px;
  padding:26px;
  border-radius:24px;
  background:linear-gradient(180deg,#2a0f0f,#100303);
  box-shadow:0 0 50px rgba(255,0,0,.45);
  border:2px solid rgba(255,0,0,.25);
}
h1{
  text-align:center;
  font-family:'Orbitron',sans-serif;
  font-size:26px;
  letter-spacing:2px;
  color:#ff3b3b;
  text-shadow:0 0 12px #ff0000;
}
.clock{
  text-align:center;
  font-family:'Orbitron',sans-serif;
  font-size:16px;
  margin:10px 0 16px;
  color:#ff7f7f;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.form-group{
  display:flex;
  flex-direction:column;
}
.form-group.full{
  grid-column:1 / -1;
}
label{
  font-size:11px;
  opacity:.85;
  margin-bottom:4px;
}
select,input{
  padding:13px;
  background:#2b0c0c;
  border:1px solid #ff3b3b55;
  border-radius:14px;
  color:#ffd9d9;
}
button{
  width:48%;
  padding:15px;
  border:none;
  border-radius:20px;
  background:linear-gradient(90deg,#ff3b3b,#ff0000);
  font-family:'Orbitron',sans-serif;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,0,0,.75);
}
.signal{
  margin-top:22px;
  padding:16px;
  border-radius:18px;
  background:#1b0a0a;
  border:2px solid rgba(255,0,0,.35);
  display:none;
  white-space:pre-line;
  font-size:14px;
}
.footer{
  text-align:center;
  margin-top:16px;
  font-size:11px;
  opacity:.6;
}
.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(4px);
  align-items:center;
  justify-content:center;
}
.modal{
  background:#2a0a0a;
  padding:22px;
  border-radius:16px;
  width:300px;
  border:2px solid #ff3b3b;
  text-align:center;
}
.modal input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  background:#1c0b0b;
  border:1px solid #ff3b3b55;
  color:#ffd9d9;
}
.modal .error{
  color:#ff6666;
  font-size:13px;
}
.copy-btn{
  margin-top:10px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:18px;
  background:#00ff9c;
  color:#000;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="panel">
<h1>FRACTAL LOGIC</h1>
<div class="clock" id="clock">--:--:--</div>

<div class="form-grid">
  <div class="form-group">
    <label>Broker</label>
    <select id="broker">
      <option>Quotex</option>
      <option>Pocket Option</option>
      <option>Binomo</option>
    </select>
  </div>
  <div class="form-group">
    <label>Market Mode</label>
    <select id="marketMode" onchange="updatePairs()">
      <option value="REAL">REAL Market</option>
      <option value="OTC">OTC Market</option>
    </select>
  </div>
  <div class="form-group full">
    <label>Asset Pair</label>
    <select id="pair"></select>
  </div>
  <div class="form-group">
    <label>Time Frame</label>
    <select id="timeFrame">
      <option>1 Minute</option>
      <option>2 Minute</option>
      <option>5 Minute</option>
    </select>
  </div>
  <div class="form-group">
    <label>Time Mode</label>
    <select>
      <option>BDT (GMT +6)</option>
    </select>
  </div>
  <div class="form-group full">
    <label>Number of Signals</label>
    <input type="number" id="signalCount" placeholder="1 - 20" min="1" max="20">
  </div>
</div>

<div style="display:flex;justify-content:space-between;margin-top:18px;">
  <button onclick="openModal()">GENERATE</button>
  <button onclick="resetSignal()">RESET</button>
</div>

<div class="signal" id="signalBox"></div>
<button class="copy-btn" onclick="copySignal()" id="copyBtn" style="display:none;">Copy All</button>

<div class="footer">© Powered by Quotex Signal Engine</div>
</div>

<div class="modal-bg" id="modalBg">
<div class="modal">
<h3 style="color:#ff3b3b;">🔒 Verification</h3>
<input type="password" id="codeInput" placeholder="Enter code">
<div style="display:flex;justify-content:space-between;">
<button onclick="submitCode()">Submit</button>
<button onclick="closeModal()">Cancel</button>
</div>
<div class="error" id="modalError"></div>
</div>
</div>

<script>
const verifyCode="105";
const realPairs=["EUR/USD","GBP/USD","USD/JPY","USD/CHF","AUD/USD","USD/CAD","EUR/JPY","GBP/JPY","EUR/GBP"];
const otcPairs=["USD/BRL (OTC)","GBP/NZD (OTC)","NZD/JPY (OTC)","USD/IDR (OTC)","USD/BDT (OTC)","USD/INR (OTC)","USD/PHP (OTC)","NZD/CAD (OTC)","AUD/NZD (OTC)","USD/ARS (OTC)","CAD/CHF (OTC)","USD/PKR (OTC)","USD/EGP (OTC)","USD/MXN (OTC)","USD/TRY (OTC)","EUR/NZD (OTC)","NZD/CHF (OTC)","USD/COP (OTC)","USD/DZD (OTC)","USD/NGN (OTC)","USD/ZAR (OTC)","NZD/USD (OTC)"];

function updatePairs(){
  const mode=document.getElementById("marketMode").value;
  const sel=document.getElementById("pair");
  sel.innerHTML="";
  (mode==="REAL"?realPairs:otcPairs).forEach(p=>{
    const o=document.createElement("option");
    o.textContent=p;
    sel.appendChild(o);
  });
}
updatePairs();

function updateClock(){
  const now=new Date();
  const bdt=new Date(now.getTime()+6*60*60*1000);
  clock.innerText=bdt.toUTCString().slice(17,25);
}
setInterval(updateClock,1000);updateClock();

function openModal(){
  modalBg.style.display="flex";
  modalError.innerText="";
  codeInput.value="";
}
function closeModal(){modalBg.style.display="none";}
function submitCode(){
  if(codeInput.value!==verifyCode){
    modalError.innerText="❌ Invalid Code";
    return;
  }
  closeModal();
  generateSignal();
}

function generateSignal(){
  const count=parseInt(signalCount.value);
  if(!count||count<1||count>20){alert("Enter 1-20"); return;}
  const broker=document.getElementById("broker").value;
  const mm=document.getElementById("timeFrame").value;
  const pair=document.getElementById("pair").value;

  const now=new Date();
  const bdt=new Date(now.getTime()+6*60*60*1000);
  const dateStr=`🎇 ${bdt.getDate().toString().padStart(2,'0')}.${(bdt.getMonth()+1).toString().padStart(2,'0')}.${bdt.getFullYear()} | UTC +6 (Dhaka)`;
  const header=`📊 ${broker} | MM: ${mm}\n\n📌 Rule: Trade opposite of previous Fractal\n\n`;

  let body="";
  let currentMinutes=bdt.getHours()*60+bdt.getMinutes();
  for(let i=0;i<count;i++){
    const gap=Math.floor(Math.random()*3)+2; // 2-4 min gap
    currentMinutes+=gap;
    let h=Math.floor(currentMinutes/60)%24;
    let m=currentMinutes%60;
    let timeStr=`〆${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
    body+=`  ${timeStr}: ${pair}\n`;
  }

  body+="\n🚫 Avoid: Doji • Gap • Low Payout";

  signalBox.style.display="block";
  signalBox.innerText=dateStr+"\n"+header+body;
  document.getElementById("copyBtn").style.display="block";
}

function resetSignal(){
  signalBox.innerHTML="";
  signalBox.style.display="none";
  document.getElementById("copyBtn").style.display="none";
}

function copySignal(){
  const text=signalBox.innerText;
  navigator.clipboard.writeText(text).then(()=>alert("Signal copied!"));
}
</script>
</body>
</html>
