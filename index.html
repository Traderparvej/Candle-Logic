<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quotex Signal Engine - Fractal Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{margin:0;background:radial-gradient(circle at top,#1a0a0a,#050202);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Roboto Mono',monospace;color:#fff;}
.panel{width:420px;padding:28px;border-radius:24px;background:linear-gradient(180deg,#2a0f0f,#100303);box-shadow:0 0 50px rgba(255,0,0,.45);border:2px solid rgba(255,0,0,.25);}
h1{text-align:center;font-family:'Orbitron',sans-serif;font-size:28px;letter-spacing:2px;color:#ff3b3b;text-shadow:0 0 12px #ff0000;}
.clock{text-align:center;font-family:'Orbitron',sans-serif;font-size:18px;margin:12px 0 24px;color:#ff7f7f;}
label{font-size:12px;opacity:.8;}
select{width:100%;padding:14px;margin:10px 0 18px;background:#2b0c0c;border:1px solid #ff3b3b55;border-radius:14px;color:#ffd9d9;}
button{width:48%;padding:16px;border:none;border-radius:20px;background:linear-gradient(90deg,#ff3b3b,#ff0000);font-family:'Orbitron',sans-serif;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 0 25px rgba(255,0,0,.75);}
.signal{margin-top:24px;padding:22px;border-radius:18px;background:#1b0a0a;border:2px solid rgba(255,0,0,.35);display:none;}
.signal-card{border-radius:16px;padding:18px;font-size:16px;line-height:1.6;white-space:pre-line;color:#fff;text-shadow:0 0 6px #ff3b3b;font-weight:500;}
.signal-card span.action-buy{color:#00ff9c;font-weight:700;text-shadow:0 0 10px #00ff9c;}
.signal-card span.action-sell{color:#ff4444;font-weight:700;text-shadow:0 0 10px #ff4444;}
.footer{text-align:center;margin-top:18px;font-size:11px;opacity:.6;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
.modal{background:#2a0a0a;padding:24px;border-radius:16px;width:300px;border:2px solid #ff3b3b;text-align:center;}
.modal input{width:100%;padding:12px;margin-bottom:12px;border-radius:12px;background:#1c0b0b;border:1px solid #ff3b3b55;color:#ffd9d9;}
.modal .error{color:#ff6666;font-size:13px;}
.hacker{font-family:'Roboto Mono',monospace;}
.flash{animation: flash 1s infinite;}
@keyframes flash{0%{box-shadow:0 0 10px #00ff9c}50%{box-shadow:0 0 30px #00ff9c}100%{box-shadow:0 0 10px #00ff9c}}
</style>
</head>

<body>

<div class="panel">
  <h1>FRACTAL LOGIC</h1>
  <div class="clock" id="clock">--:--:--</div>

  <label>Asset Pair</label>
  <select id="pair">
    <option>USD/INR (OTC)</option>
    <option>USD/BRL (OTC)</option>
    <option>USD/MXN (OTC)</option>
    <option>NZD/JPY (OTC)</option>
    <option>USD/TRY (OTC)</option>
  </select>

  <label>Strategy</label>
  <select id="strategy">
    <option>Fractal Bull</option>
    <option>Fractal Bear</option>
  </select>

  <div style="display:flex;justify-content:space-between;">
    <button onclick="openModal()">GENERATE</button>
    <button onclick="resetSignal()">RESET</button>
  </div>

  <div class="signal" id="signalBox">
    <div class="signal-card" id="message"></div>
  </div>

  <div class="footer">© Powered by Quotex Signal Engine</div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 style="color:#ff3b3b;">🔒 Verification</h3>
    <input type="password" id="codeInput" placeholder="Enter code">
    <div style="display:flex;justify-content:space-between;">
      <button onclick="submitCode()">Submit</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
    <div class="error" id="modalError"></div>
  </div>
</div>

<script>
const verifyCode="105";

function updateClock(){
  clock.innerText=new Date().toLocaleTimeString("en-US",{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000);updateClock();

function openModal(){modalBg.style.display="flex";codeInput.value="";modalError.innerText="";}
function closeModal(){modalBg.style.display="none";}
function submitCode(){if(codeInput.value===verifyCode){closeModal();generateSignal();}else modalError.innerText="❌ Invalid Code";}

// -------------------- Generate Signal --------------------
function generateSignal(){
  const pair=document.getElementById("pair").value;
  const strategy=document.getElementById("strategy").value;
  const box=document.getElementById("message");

  const gap=Math.random()<0.5?2:3;
  const entry=new Date();
  entry.setMinutes(entry.getMinutes()+gap);
  const time=entry.toLocaleTimeString("en-US",{hour:'2-digit',minute:'2-digit'});
  const action=(strategy==="Fractal Bull")?"BUY":"SELL";
  const actionClass=(action==="BUY")?"action-buy":"action-sell";

  const text=`⚡ FRACTAL LOGIC
💱 ${pair}
⏰ Time: ${time}
⏳ Expiry: 1m

📊 ${strategy}
🚀 <span class="${actionClass}">${action}</span>`;

  typeWriter(box,text.trim(),18);
  document.getElementById("signalBox").style.display="block";

  const delay=(gap*60-5)*1000;
  setTimeout(()=>box.classList.add("flash"),delay);
}

// -------------------- Typing Effect --------------------
function typeWriter(el,text,speed){
  el.innerHTML="";
  el.className="signal-card hacker";
  let i=0;
  const t=setInterval(()=>{
    el.innerHTML+=text.charAt(i);
    i++;
    if(i>=text.length) clearInterval(t);
  },speed);
}

function resetSignal(){
  const box=document.getElementById("message");
  box.innerHTML="";
  box.className="signal-card";
  document.getElementById("signalBox").style.display="none";
}
</script>

</body>
</html>
